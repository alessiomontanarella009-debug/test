<!doctype html>
<html lang="it">
<meta charset="utf-8">
<title>Cubolandia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: la scena 3D occupa tutto lo schermo; sopra, HUD (mirino, hotbar, F3) e schermate di pietra centrate (menu, impostazioni, pausa). Gioco a tema unico scuro. */
:root {
  --sky: #9dcbff;
  --stone-hi: #c6c9cd;
  --stone: #7c8085;
  --stone-lo: #35373a;
  --ink: #0d1014;
  --text: #f4f3ee;
  --accent: #ffd45e;
  --font-display: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  --font-body: 'VT323', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font-family: var(--font-body); -webkit-user-select: none; user-select: none; }
button, input { font: inherit; color: inherit; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#uw { position: absolute; inset: 0; background: rgba(22, 64, 150, 0.42); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); mix-blend-mode: difference; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
#crosshair::before { left: 0; right: 0; top: 11px; height: 2px; }
#crosshair::after { top: 0; bottom: 0; left: 11px; width: 2px; }
#hotwrap { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
#itemname { font-size: 26px; line-height: 1; color: var(--text); text-shadow: 2px 2px 0 var(--ink); opacity: 0; transition: opacity 0.35s ease; min-height: 1em; }
#itemname.show { opacity: 1; transition: none; }
#hotbar { --slot: clamp(34px, 6.2vw, 54px); display: flex; padding: 4px; background: rgba(13, 16, 20, 0.62); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px rgba(198, 201, 205, 0.25); }
.slot { position: relative; width: var(--slot); height: var(--slot); background: rgba(139, 139, 139, 0.45); border: 2px solid; border-color: rgba(55,55,55,0.9) rgba(255,255,255,0.55) rgba(255,255,255,0.55) rgba(55,55,55,0.9); display: grid; place-items: center; }
.slot canvas { width: 82%; height: 82%; display: block; image-rendering: pixelated; }
.slot.sel { z-index: 1; background: rgba(198, 201, 205, 0.38); box-shadow: 0 0 0 3px var(--text), 0 0 0 5px var(--ink); }

#debug { position: absolute; z-index: 1; left: max(8px, env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; pointer-events: none; font-size: 21px; line-height: 1.05; }
#debug div { background: rgba(13, 16, 20, 0.55); padding: 1px 6px 2px; color: var(--text); white-space: pre; max-width: calc(100vw - 16px); overflow: hidden; }

/* Schermate */
.screen {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding-top: 24px; padding-bottom: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(13, 16, 20, 0.58);
  overflow-y: auto;
}
#screen-settings, #screen-inv { background: rgba(13, 16, 20, 0.22); }
#screen-settings.fromgame { background: rgba(13, 16, 20, 0.12); }
#screen-main { background: linear-gradient(180deg, rgba(13,16,20,0.55), rgba(13,16,20,0.32) 45%, rgba(13,16,20,0.72)); }

.menu { display: flex; flex-direction: column; align-items: center; gap: 30px; width: min(560px, 100%); margin: auto; }
.stack { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }

.logo {
  margin: 0; text-align: center; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(26px, 8vw, 58px); line-height: 1.3; letter-spacing: 0.02em;
  color: var(--stone-hi);
}
.logo.ready {
  background: linear-gradient(rgba(255,255,255,0.10), rgba(0,0,0,0.12)), var(--stone-url, none);
  background-size: auto, 72px 72px;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 5px 0 #0d1014) drop-shadow(0 0 1px #0d1014);
}
.pause-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(16px, 4.5vw, 24px); color: var(--stone-hi); text-shadow: 3px 3px 0 #0d1014; }

.btn {
  width: min(100%, 420px);
  padding: 8px 16px 10px;
  font-family: var(--font-body); font-size: clamp(24px, 5.5vw, 32px); line-height: 1.15; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text); text-shadow: 2px 2px 0 #26282b;
  background: var(--stone);
  border: 4px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
  box-shadow: 0 0 0 3px var(--ink);
  cursor: pointer; text-align: center;
}
.btn:hover { background: #8f949a; color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; color: var(--accent); }
.btn:active { border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); background: #6c7075; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.small { width: auto; min-width: 96px; font-size: clamp(20px, 4.5vw, 26px); padding: 5px 14px 7px; }
.btn.on { color: var(--accent); background: #62666b; border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); }

.hint { margin: 0; max-width: 480px; text-align: center; font-size: 21px; line-height: 1.25; color: rgba(244,243,238,0.82); text-shadow: 2px 2px 0 #0d1014; }
.status { margin: 0; min-height: 1.2em; text-align: center; font-size: 22px; color: var(--accent); text-shadow: 2px 2px 0 #0d1014; }

.panel {
  width: min(540px, 100%); margin: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 22px 22px 24px;
  background: rgba(16, 18, 22, 0.55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(14px, 4vw, 20px); color: var(--stone-hi); text-shadow: 3px 3px 0 #0d1014; text-align: center; }
.tabs { display: flex; gap: 12px; justify-content: center; }
.tabbody { display: flex; flex-direction: column; gap: 18px; }
.invpanel { width: min(640px, 100%); align-items: center; gap: 14px; }
.invgrid { display: grid; grid-template-columns: repeat(9, var(--cell)); gap: 4px; --cell: clamp(32px, 8.6vw, 58px); }
#invgrid { max-height: min(calc(var(--cell) * 5 + 24px), 36vh); overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 4px 4px; scrollbar-width: thin; align-content: start; background: rgba(0,0,0,0.18); }
#cretabs { gap: 6px; }
#cretabs .btn.small { min-width: 0; font-size: clamp(13px, 2.9vw, 19px); padding: 3px 7px 5px; }
.book { --cell: clamp(28px, 7vw, 46px); max-height: 170px; overflow-y: auto; padding: 6px; background: rgba(0,0,0,0.28); }
.icell.dim { opacity: 0.3; }
.invhot { margin-top: 2px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); }
.icell { width: var(--cell); height: var(--cell); padding: 0; display: grid; place-items: center; cursor: pointer;
  background: rgba(139,139,139,0.35); border: 2px solid; border-color: rgba(55,55,55,0.9) rgba(255,255,255,0.5) rgba(255,255,255,0.5) rgba(55,55,55,0.9); border-radius: 0; }
.icell:disabled { cursor: default; }
.icell:not(:disabled):hover, .icell:focus-visible { background: rgba(255,255,255,0.38); outline: 2px solid var(--accent); outline-offset: 1px; }
.icell.sel { box-shadow: 0 0 0 3px var(--text); }
.cnt { position: absolute; right: 3px; bottom: 0; font-size: 22px; line-height: 1; color: #fff; text-shadow: 2px 2px 0 #1a1a1a; pointer-events: none; }
.icell { position: relative; }
#brk { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); width: 90px; height: 8px; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.7); }
#brk i { display: block; height: 100%; width: 0; background: #ffd24a; }
.craftrow { display: flex; align-items: center; justify-content: center; gap: 18px; --cell: clamp(32px, 8.6vw, 58px); }
.craftrow .arrow { font-size: 30px; color: rgba(244,243,238,0.8); }
#craftout { --cell: clamp(32px, 8.6vw, 58px); }
.icell.out { width: calc(var(--cell) * 1.15); height: calc(var(--cell) * 1.15); }
#cursorItem { position: fixed; z-index: 30; left: -100px; top: -100px; width: 44px; height: 44px; pointer-events: none; }
#cursorItem canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.icell canvas { width: 82%; height: 82%; display: block; image-rendering: pixelated; pointer-events: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.row { padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.row label { font-size: 27px; line-height: 1; text-shadow: 2px 2px 0 #0d1014; min-width: 0; }
.row output { font-size: 27px; line-height: 1; color: var(--accent); text-shadow: 2px 2px 0 #0d1014; font-variant-numeric: tabular-nums; }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; height: 26px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.row input[type="range"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.row-toggle { align-items: center; }
.toggle { min-width: 72px; }
.toggle[aria-checked="true"] { color: var(--accent); }
.actions { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; }
.actions .btn:not(.small) { width: min(100%, 260px); }

.wlist { display: flex; flex-direction: column; gap: 10px; max-height: 42vh; overflow-y: auto; padding-right: 4px; }
.wrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(13, 16, 20, 0.55); border: 2px solid var(--stone-lo); }
.winfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.winfo strong { font-weight: 400; font-size: 27px; line-height: 1; text-shadow: 2px 2px 0 var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.winfo span { font-size: 20px; line-height: 1; color: rgba(244, 243, 238, 0.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .btn.small { min-width: 78px; padding: 4px 8px 6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 26px; line-height: 1; text-shadow: 2px 2px 0 var(--ink); }
.field input { width: 100%; padding: 8px 10px; font-size: 28px; line-height: 1.1; background: #15171a; color: var(--text); border: 3px solid; border-color: var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo); border-radius: 0; -webkit-user-select: text; user-select: text; }
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) { .panel { padding: 18px 16px 20px; } .wrow { flex-wrap: wrap; } }

.tabs { flex-wrap: wrap; }
.keynote { margin: 0; font-size: 20px; line-height: 1.3; color: rgba(244,243,238,0.85); text-shadow: 2px 2px 0 #0d1014; }
.newsh { margin: 6px 0 0; font-size: 27px; color: var(--accent); text-shadow: 2px 2px 0 #0d1014; }
.newsl { margin: 0; padding-left: 22px; font-size: 20px; line-height: 1.3; text-shadow: 2px 2px 0 #0d1014; }
#vitals { display: flex; justify-content: space-between; align-self: stretch; margin-bottom: -4px; }
#vitals canvas { width: 204px; height: 44px; image-rendering: pixelated; }
#lockhint { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); padding: 8px 16px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.7); color: #fff; font-size: 24px; pointer-events: none; text-transform: uppercase; letter-spacing: 0.04em; }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(180,0,0,0) 35%, rgba(190,10,10,0.75) 100%); }
#screen-dead { background: rgba(120,10,10,0.45); }
.keybtn { min-width: 170px; }
.skinprev { align-self: center; width: 160px; height: 228px; image-rendering: pixelated; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); }
.colorin { width: 74px; height: 38px; padding: 0; border: 2px solid rgba(255,255,255,0.7); background: none; cursor: pointer; }
#chatlog { position: absolute; left: 12px; bottom: 84px; width: min(560px, 70vw); display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
#chatlog div { font-size: 22px; line-height: 1.15; color: #fff; background: rgba(0,0,0,0.45); padding: 2px 8px; text-shadow: 2px 2px 0 #0d1014; transition: opacity 0.6s; overflow-wrap: anywhere; }
#chatlog div.err { color: #ff9a8a; }
#chatlog div.old { opacity: 0; }
#chatlog.open div.old { opacity: 1; }
#chatbar { position: absolute; left: 12px; bottom: 12px; width: min(640px, calc(100vw - 24px)); z-index: 6; }
#chatbar input { width: 100%; box-sizing: border-box; font: inherit; font-size: 24px; color: #fff; background: rgba(0,0,0,0.65); border: 2px solid rgba(255,255,255,0.75); padding: 4px 10px; outline: none; }
/* Comandi touch */
html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#touch { position: absolute; inset: 0; z-index: 4; pointer-events: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#touch[hidden] { display: none; }
#tzone { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
.tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 3px solid rgba(255,255,255,0.7); background: rgba(13,16,20,0.45); color: #fff; font: 22px 'VT323', monospace; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1; -webkit-user-select: none; user-select: none; }
.tb.on { background: rgba(255,255,255,0.45); }
.tb.sq { border-radius: 8px; width: 48px; height: 48px; font-size: 18px; }
#tjump { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; }
#tsneak { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; }
#tbreak { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; }
#tplace { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; }
#tpause { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
#tinv { right: calc(68px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
#tview { right: calc(124px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
#tjoy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); background: rgba(13,16,20,0.25); pointer-events: none; }
#tjoy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.55); }
@media (pointer: coarse) {
  #hotbar { --slot: clamp(36px, 8vw, 52px); }
  #hotbar .slot { touch-action: none; }
  #hotwrap { z-index: 5; }
}
@media (pointer: coarse) and (max-height: 520px) {
  .screen { padding-top: 6px; padding-bottom: 6px; }
  .screen .panel { zoom: 0.62; }
  .screen .menu { zoom: 0.7; }
  #hud .slot { pointer-events: auto; }
  .screen { overflow-y: auto; -webkit-overflow-scrolling: touch; }
}
</style>

<div id="app">
  <canvas id="gl" aria-label="Mondo di gioco"></canvas>

  <div id="cursorItem" hidden><canvas width="64" height="64"></canvas><span class="cnt"></span></div>
  <div id="hud" hidden>
    <div id="uw" hidden></div>
    <div id="crosshair"></div>
    <div id="brk" hidden><i></i></div>
    <div id="hurt"></div>
    <div id="lockhint" hidden>Clicca per continuare</div>
    <div id="touch" hidden>
      <div id="tzone"></div>
      <div id="tjoy" hidden><i></i></div>
      <div class="tb" id="tbreak">ROMPI</div>
      <div class="tb" id="tplace">USA</div>
      <div class="tb" id="tjump">SALTA</div>
      <div class="tb" id="tsneak">GIÙ</div>
      <div class="tb sq" id="tpause">II</div>
      <div class="tb sq" id="tinv">INV</div>
      <div class="tb sq" id="tview">VISTA</div>
    </div>
    <div id="chatlog"></div>
    <div id="chatbar" hidden><input id="chatinput" type="text" maxlength="140" autocomplete="off" spellcheck="false" aria-label="Chat"></div>
    <div id="hotwrap">
      <div id="itemname"></div>
      <div id="vitals" hidden><canvas id="vhp" width="204" height="44"></canvas><canvas id="vfood" width="204" height="44"></canvas></div>
      <div id="hotbar" aria-label="Barra degli oggetti"></div>
    </div>
  </div>

  <section class="screen" id="screen-main" aria-label="Menu principale">
    <div class="menu">
      <h1 class="logo" id="logo">CUBO<br>LANDIA</h1>
      <div class="stack">
        <button class="btn" id="btn-play" type="button">Gioca in singolo</button>
        <button class="btn" id="btn-settings-main" type="button">Impostazioni</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </section>

  <section class="screen" id="screen-worlds" aria-label="Seleziona mondo" hidden>
    <div class="panel">
      <h2>Seleziona mondo</h2>
      <div class="wlist" id="worldlist"></div>
      <div class="actions">
        <button class="btn" id="btn-newworld" type="button">Crea nuovo mondo</button>
        <button class="btn small" id="btn-worlds-back" type="button">Indietro</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-create" aria-label="Nuovo mondo" hidden>
    <div class="panel">
      <h2>Nuovo mondo</h2>
      <div class="field">
        <label for="new-name">Nome del mondo</label>
        <input id="new-name" type="text" maxlength="24" placeholder="Mondo" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="new-seed">Seed (vuoto = casuale)</label>
        <input id="new-seed" type="text" maxlength="32" placeholder="Casuale" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Modalità di gioco</label>
        <div class="actions">
          <button class="btn small on" id="gm-c" type="button" aria-pressed="true">Creativa</button>
          <button class="btn small" id="gm-s" type="button" aria-pressed="false">Sopravvivenza</button>
        </div>
      </div>
      <p class="hint">Lo stesso seed genera sempre lo stesso mondo. Ogni seed ha mare, colline e laghi diversi.</p>
      <div class="actions">
        <button class="btn" id="btn-create-go" type="button">Crea e gioca</button>
        <button class="btn small" id="btn-create-back" type="button">Indietro</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-settings" aria-label="Impostazioni" hidden>
    <div class="panel">
      <h2>Impostazioni</h2>
      <div class="tabs" role="tablist">
        <button class="btn small on" id="tabbtn-game" role="tab" aria-selected="true" type="button">Gioco</button>
        <button class="btn small" id="tabbtn-gfx" role="tab" aria-selected="false" type="button">Grafica</button>
        <button class="btn small" id="tabbtn-keys" role="tab" aria-selected="false" type="button">Tasti</button>
        <button class="btn small" id="tabbtn-skin" role="tab" aria-selected="false" type="button">Skin</button>
        <button class="btn small" id="tabbtn-news" role="tab" aria-selected="false" type="button">Novità</button>
      </div>
      <div class="tabbody" id="tab-game" role="tabpanel"></div>
      <div class="tabbody" id="tab-gfx" role="tabpanel" hidden></div>
      <div class="tabbody" id="tab-keys" role="tabpanel" hidden></div>
      <div class="tabbody" id="tab-skin" role="tabpanel" hidden></div>
      <div class="tabbody" id="tab-news" role="tabpanel" hidden></div>
      <div class="actions">
        <button class="btn small" id="btn-reset" type="button">Ripristina</button>
        <button class="btn" id="btn-back" type="button">Fatto</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-inv" aria-label="Inventario" hidden>
    <div class="panel invpanel">
      <h2 id="invtitle">Inventario creativo</h2>
      <button class="btn small" id="invclose" type="button" hidden>Chiudi</button>
      <div class="tabs" id="cretabs" hidden></div>
      <button class="btn small" id="btn-book" type="button" hidden>Libro ricette</button>
      <div class="invgrid book" id="recbook" hidden></div>
      <div class="craftrow" id="craftrow" hidden><div class="invgrid" id="craftgrid"></div><span class="arrow">&#10140;</span><div id="craftout"></div></div>
      <div class="invgrid" id="boxgrid" hidden></div>
      <div class="craftrow" id="furnrow" hidden></div>

    if ((ec === 'KeyR' || ec === 'ControlLeft' || ec === 'ControlRight') && !e.repeat) { sprintReq = true; e.preventDefault(); }
    if (ec === 'Space' && !e.repeat) {   // doppio tocco su Spazio: attiva o disattiva il volo
      var tnow = performance.now();
      if (tnow - lastSpace < 320) {
        lastSpace = 0;
        if (gm !== 's') {   // in sopravvivenza non si vola
          flying = !flying;
          if (flying) { p.vy = 0; onGround = false; sprintLatched = false; }
        }
      } else lastSpace = tnow;
    }
    if (GAME_KEYS.indexOf(ec) >= 0) { keys[ec] = true; e.preventDefault(); }
    else if (ec === 'KeyV' && !e.repeat) third = ((third | 0) + 1) % 3;   // prima persona / da dietro / davanti
    else if (/^Digit[1-9]$/.test(ec)) selectSlot(Number(ec.charAt(5)) - 1);
  });
  window.addEventListener('keyup', function (e) { keys[canon(e.code)] = false; });
  // Ctrl+W chiuderebbe la scheda: mentre si gioca il browser chiede conferma (il mondo e' comunque salvato)
  window.addEventListener('beforeunload', function (e) { if (mode === 'playing') { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('blur', function () { keys = {}; mouse.left = mouse.right = false; dragging = false; });

  document.addEventListener('pointerlockchange', function () {
    locked = (document.pointerLockElement === canvas);
    if (locked) { everLocked = true; lockFails = 0; $('lockhint').hidden = true; }
    if (locked && mode !== 'playing') { try { document.exitPointerLock(); } catch (e) {} }   // il blocco arrivato in ritardo (mentre c'e' un menu) viene subito rilasciato
    if (!locked && mode === 'playing') openPause();
    if (mode !== 'playing') $('lockhint').hidden = true;
  });
  document.addEventListener('pointerlockerror', function () { locked = false; noteLockFail(); });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('mousedown', function (e) {
    if (mode !== 'playing') return;
    e.preventDefault();
    if (!locked) {
      if (!dragFallback()) { requestLock(); return; }
      // Senza blocco del puntatore: trascina per guardare, clic senza trascinare rompe, tasto destro piazza
      if (e.button === 0) { dragging = true; dragDist = 0; if (gm === 's') mouse.left = true; }
      else if (e.button === 2) placeBlock();
      else if (e.button === 1) pickBlock();
      return;
    }
    if (e.button === 0) { mouse.left = true; actCd = 0; }
    else if (e.button === 2) { mouse.right = true; actCd = 0; }
    else if (e.button === 1) pickBlock();
  });
  window.addEventListener('mouseup', function (e) {
    if (e.button === 0) {
      if (dragging && dragDist < 5 && mode === 'playing' && gm !== 's') breakBlock();
      dragging = false; mouse.left = false;
    } else if (e.button === 2) mouse.right = false;
  });
  document.addEventListener('mousemove', function (e) {
    if (mode !== 'playing' || !(locked || dragging)) return;
    var dx = e.movementX || 0, dy = e.movementY || 0;
    if (Math.abs(dx) > 300 || Math.abs(dy) > 300) return;
    if (dragging) dragDist += Math.abs(dx) + Math.abs(dy);
    var s = 0.0022 * settings.sens / 100;
    yaw -= dx * s;
    pitch = Math.max(-1.55, Math.min(1.55, pitch - dy * s));
  });
  // ---------- Comandi touch (telefono / tablet) ----------
  if (TOUCH) { $('invclose').hidden = false; $('invclose').addEventListener('click', function () { handleEscape(); }); }
  var tEl = $('touch'), tJoy = $('tjoy'), tzone = $('tzone');
  var tMove = null, tLook = null, tSneak = false;
  function touchUI() {
    if (!tEl) return;
    var on = TOUCH && mode === 'playing' && !ui;
    tEl.hidden = !on;
    if (!on) { tJoy.hidden = true; tMove = tLook = null; if (tSneak) { tSneak = false; $('tsneak').classList.remove('on'); } if (TOUCH) { keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false; } }
  }
  function joyKeys(dx, dy) {
    var R = 50, m = Math.sqrt(dx * dx + dy * dy), dz = 14;
    keys.KeyW = dy < -dz && -dy > Math.abs(dx) * 0.4;
    keys.KeyS = dy > dz && dy > Math.abs(dx) * 0.4;
    keys.KeyA = dx < -dz && -dx > Math.abs(dy) * 0.4;
    keys.KeyD = dx > dz && dx > Math.abs(dy) * 0.4;
    if (keys.KeyW && m > R * 1.15) sprintReq = true;
    var k = Math.min(1, R / (m || 1));
    tJoy.firstChild.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
  }
  function tFind(list, id) { for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i]; return null; }
  tzone.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (mode !== 'playing') return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < innerWidth * 0.42 && !tMove) {
        tMove = { id: t.identifier, x: t.clientX, y: t.clientY };
        tJoy.style.left = t.clientX + 'px'; tJoy.style.top = t.clientY + 'px'; tJoy.hidden = false;
        joyKeys(0, 0);
      } else if (!tLook) {
        tLook = { id: t.identifier, x: t.clientX, y: t.clientY, sx: t.clientX, sy: t.clientY, t0: performance.now(), moved: false, held: false };
        tLook.timer = setTimeout(function () {
          if (tLook && !tLook.moved && mode === 'playing') { tLook.held = true; mouse.left = true; actCd = 0; }
        }, 380);
      }
    }
  }, { passive: false });
  tzone.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (mode !== 'playing') return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (tMove && t.identifier === tMove.id) joyKeys(t.clientX - tMove.x, t.clientY - tMove.y);
      else if (tLook && t.identifier === tLook.id) {
        var dx = t.clientX - tLook.x, dy = t.clientY - tLook.y;
        tLook.x = t.clientX; tLook.y = t.clientY;
        if (!tLook.moved && Math.abs(t.clientX - tLook.sx) + Math.abs(t.clientY - tLook.sy) > 12) tLook.moved = true;
        if (tLook.moved) {
          var s = 0.0034 * settings.sens / 100;
          yaw -= dx * s;
          pitch = Math.max(-1.55, Math.min(1.55, pitch - dy * s));
        }
      }
    }
  }, { passive: false });
  function tEnd(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (tMove && t.identifier === tMove.id) { tMove = null; tJoy.hidden = true; keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false; }
      else if (tLook && t.identifier === tLook.id) {
        clearTimeout(tLook.timer);
        if (tLook.held) mouse.left = false;
        else if (!tLook.moved && mode === 'playing' && e.type === 'touchend') { mouse.right = true; actCd = 0; setTimeout(function () { mouse.right = false; }, 60); }   // tocco breve = usa / piazza
        tLook = null;
      }
    }
  }
  tzone.addEventListener('touchend', tEnd, { passive: false });
  tzone.addEventListener('touchcancel', tEnd, { passive: false });
  function tBtn(id, down, up) {
    var el = $(id);
    el.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); el.classList.add('on'); if (down) down(); }, { passive: false });
    function end(e) { e.preventDefault(); e.stopPropagation(); if (!tSneakBtn(id)) el.classList.remove('on'); if (up) up(); }
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
  }
  function tSneakBtn(id) { return id === 'tsneak' && tSneak; }
  function fakeKey(type, code) { window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true })); }
  tBtn('tjump', function () { fakeKey('keydown', 'Space'); }, function () { fakeKey('keyup', 'Space'); });
  tBtn('tbreak', function () { mouse.left = true; actCd = 0; }, function () { mouse.left = false; });
  tBtn('tplace', function () { mouse.right = true; actCd = 0; }, function () { mouse.right = false; });
  tBtn('tsneak', function () { tSneak = !tSneak; keys.ShiftLeft = tSneak; $('tsneak').classList.toggle('on', tSneak); }, null);
  tBtn('tpause', function () { handleEscape(); }, null);
  tBtn('tinv', function () { if (mode === 'playing') openInventory(); }, null);
  tBtn('tview', function () { third = ((third | 0) + 1) % 3; }, null);
  // barra degli oggetti: un tocco seleziona la casella
  $('hotbar').addEventListener('touchstart', function (e) {
    if (mode !== 'playing') return;
    var sl = e.target.closest ? e.target.closest('.slot') : null, i = sl ? hotSlots.indexOf(sl) : -1;
    if (i < 0) return;
    e.preventDefault(); e.stopPropagation(); selectSlot(i);
  }, { passive: false });
  var wheelAcc = 0;
  window.addEventListener('wheel', function (e) {
    if (mode !== 'playing') return;
    e.preventDefault();
    wheelAcc += e.deltaY;
    if (Math.abs(wheelAcc) >= 60) { selectSlot(sel + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; }
  }, { passive: false });

  // ---------- Ciclo di gioco ----------
  var last = performance.now(), fpsT = last, fpsFrames = 0, gameTime = 0, waterT = 0, fallT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var cap = FPSCAP[settings.fps];
    if (cap && now - last < 1000 / cap - 2) return;
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now; gameTime += dt;
    streamTick();

    if (mode === 'playing' || ui === 'inv') {
      tickTiles(dt);
      if (ui === 'inv' && boxT && boxT.k === 'f') { uiT += dt; if (uiT > 0.25) { uiT = 0; refreshInventory(); } }
    }
    if (mode === 'playing') { cropT += dt; if (cropT >= 1) { cropT = 0; cropTick(); } }
    if (mode === 'playing') {
      updatePlayer(dt);
      if (dayCycle) { tod += dt / DAYLEN; if (tod >= 1) tod -= 1; }
      atkT -= dt; eatT -= dt;
      updateVitals(dt); updateMobs(dt);
      var tf = settings.fov * (sprintLatched && hspeed > 3 ? 1.1 : 1);
      fovCur += (tf - fovCur) * Math.min(1, dt * 10);
      if (Math.abs(camera.fov - fovCur) > 0.01) { camera.fov = fovCur; camera.updateProjectionMatrix(); }
      updateCamera(dt);
      setUnderwater(ISW[getB(Math.floor(camera.position.x), Math.floor(camera.position.y), Math.floor(camera.position.z))] === 1);
      updateTarget();
      handleActions(dt);
      updateHeld(dt);
      updateParticles(dt);
      waterT += dt; if (waterT >= 0.2) { waterT = 0; waterTick(); }
      fallT += dt; if (fallT >= 0.08) { fallT = 0; fallTick(); }
      if (nameTimer > 0) { nameTimer -= dt; if (nameTimer <= 0) $('itemname').classList.remove('show'); }
    } else if (mode === 'menu') {
      if (!reduceMotion) panAngle += dt * 0.07;
      var cx = WN / 2, cz = WN / 2, r = 75, gy = ldAt(cx, cz) ? Math.max(SEA + 1, colTop[CI(cx, cz)]) : SEA + 6;
      camera.position.set(cx + Math.cos(panAngle) * r, gy + 38, cz + Math.sin(panAngle) * r);
      camera.lookAt(cx, gy, cz);
    }
    updateDayNight();
    updateSky(gameTime);
    updateChunkVisibility();
    renderer.render(scene, camera);

    fpsFrames++;
    if (now - fpsT >= 500) {
      fps = Math.round(fpsFrames * 1000 / (now - fpsT));
      frameMs = (now - fpsT) / fpsFrames;
      fpsFrames = 0; fpsT = now;
      updateDebug();
    }
  }

  // ---------- Avvio ----------
  buildSettingsUI();
  buildKeysUI();
  buildSkinUI();
  buildNewsUI();
  showTab('game');
  buildHotbar();
  buildInventory();
  rebuildTextures();
  applyFab();
  applyPixelRatio();
  applyBrightness();
  clouds.visible = settings.clouds;
  selectSlot(0, true);
  applyView();
  requestAnimationFrame(frame);
})();
</script>
